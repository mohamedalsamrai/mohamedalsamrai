name: Profile cards

# Builds the stats, languages, streak and snake images shown in README.md and
# publishes them to the `output` branch. Generating them here (instead of
# linking to the shared public card servers) keeps them from breaking when
# those servers hit GitHub's rate limits.

on:
  schedule:
    - cron: "17 3 * * *" # every day, 06:17 Baghdad time
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output folder
        run: mkdir -p dist

      # ---- GitHub stats -----------------------------------------------------
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged&rank_icon=github&border_radius=10&bg_color=00000000&title_color=0175C2&icon_color=0175C2&ring_color=0175C2&text_color=1F2328&border_color=D0D7DE
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=prs_merged&rank_icon=github&border_radius=10&bg_color=00000000&title_color=13B9FD&icon_color=13B9FD&ring_color=13B9FD&text_color=E6EDF3&border_color=30363D
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ---- Most used languages ----------------------------------------------
      - name: Languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&border_radius=10&bg_color=00000000&title_color=0175C2&text_color=1F2328&border_color=D0D7DE
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&border_radius=10&bg_color=00000000&title_color=13B9FD&text_color=E6EDF3&border_color=30363D
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ---- Contribution streak ----------------------------------------------
      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&border_radius=10&background=00000000&border=D0D7DE&stroke=D0D7DE&ring=0175C2&fire=0175C2&currStreakNum=0175C2&currStreakLabel=0175C2&sideNums=1F2328&sideLabels=1F2328&dates=656D76
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&border_radius=10&background=00000000&border=30363D&stroke=30363D&ring=13B9FD&fire=13B9FD&currStreakNum=13B9FD&currStreakLabel=13B9FD&sideNums=E6EDF3&sideLabels=E6EDF3&dates=8B949E
          path: dist/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Contribution snake -----------------------------------------------
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#02569B&color_dots=#EBEDF0,#B6E3FF,#80CCFF,#54AEFF,#0175C2
            dist/snake-dark.svg?palette=github-dark&color_snake=#13B9FD&color_dots=#161B22,#0A3655,#0D5288,#0175C2,#0E9BE0

      # ---- Publish ----------------------------------------------------------
      # Replaces the `output` branch with a single fresh commit each run, so
      # the branch never grows and `main` stays free of bot commits.
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile cards"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
